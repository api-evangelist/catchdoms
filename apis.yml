aid: catchdoms
name: CatchDoms Expired Domains API
image: https://catchdoms.com/images/og.jpg
description: CatchDoms provides an API to discover expired and expiring domain names across multiple registrars such as Dynadot, GoDaddy, Catched,
  and DropCatch. Users can filter results by domain age, backlink count, domain authority, and other SEO metrics. The service also assigns a quality
  score to help identify hidden gem domains for resale or branding. Documentation includes endpoints for searching, retrieving domain details,
  and accessing historical data, supporting JSON responses and pagination. The platform aims to empower marketers, investors, and developers to
  capitalize on the secondary domain market efficiently.

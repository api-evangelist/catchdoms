            "in": "query",
            "description": "Filter by source platform (free-tier sources only)",
            "schema": {
              "type": "string",
              "enum": [
                "dynadot",
                "catched",
                "dropcatch",
                "godaddy",
                "gname",
                "snapnames",
                "ukdroplists",
                "subreg",
                "webexpire",
                "parkio",
                "bloomup",
                "seodomains"

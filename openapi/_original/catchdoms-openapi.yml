            }
          },
          {
            "name": "score_min",
            "in": "query",
            "description": "Minimum quality score (0-100)",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 100
            }
          },
          {
            "name": "age_min",
            "in": "query",
            "description": "Minimum age in years",
            "schema": {
              "type": "integer",
              "minimum": 0
            }
          },
          {
            "name": "type",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "auction",
                "closeout",
                "backorder"
              ]
            }
          },
          {
            "name": "has_bids",
            "in": "query",
            "schema": {
              "type": "boolean"
            }
          },
          {
            "name": "has_backlinks",
            "in": "query",
            "schema": {
              "type": "boolean"
            }
          },
          {
            "name": "da_min",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 100
            }
          },
          {
            "name": "rd_min",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 0
            }
          },
          {
            "name": "language",
            "in": "query",
            "schema": {
              "type": "string"

    "/domains": {
      "get": {
        "operationId": "listDomains",
        "summary": "Search expired and auction domains",
        "description": "Returns paginated list of domains matching the given filters, sorted by quality score.",
        "tags": [
          "Domains"
        ],
        "parameters": [
          {
            "name": "source",
            "in": "query",
            "description": "Filter by source platform",
            "schema": {
              "type": "string",
              "enum": [
                "dynadot",
                "catched",
                "dropcatch",
                "godaddy",
                "gname",
                "snapnames",
                "ukdroplists",
                "subreg",
                "webexpire",
                "parkio",
                "bloomup",
                "nicsell",
                "namesilo",
                "namecheap",
                "sedo",
                "gnews-domains",
                "backorders-domains",
                "domainlore",
                "rakkodomain",
                "seodomains",
                "nameshift",
                "namepros",
                "regfree"
              ]
            }
          },
          {
            "name": "tld",
            "in": "query",
            "description": "Filter by TLD (e.g. .com, .fr). Comma-separated for multiple.",
            "schema": {
              "type": "string"
            },
            "example": ".fr,.de,.it"
          },
          {
            "name": "score_min",
            "in": "query",
            "description": "Minimum quality score (0-100). 50+ for good, 70+ for excellent.",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 100
            }
          },
          {
            "name": "age_min",
            "in": "query",
            "description": "Minimum domain age in years (Wayback Machine first snapshot).",
            "schema": {
              "type": "integer",
              "minimum": 0
            }
          },
          {
            "name": "type",
            "in": "query",
            "description": "Filter by domain type",
            "schema": {
              "type": "string",
              "enum": [
                "auction",
                "closeout",
                "backorder"
              ]
            }
          },
          {
            "name": "has_bids",
            "in": "query",
            "description": "Only domains with active auction bids",
            "schema": {
              "type": "boolean"
            }
          },
          {
            "name": "has_backlinks",
            "in": "query",
            "description": "Only domains with referring domains",
            "schema": {
              "type": "boolean"
            }
          },
          {
            "name": "has_gmb",
            "in": "query",
            "description": "Only domains with a Google Business listing",
            "schema": {
              "type": "boolean"
            }
          },
          {
            "name": "has_edu_gov",
            "in": "query",
            "description": "Only domains with .edu or .gov referring domains",
            "schema": {
              "type": "boolean"
            }
          },
          {
            "name": "da_min",
            "in": "query",
            "description": "Minimum Domain Authority (0-100)",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 100
            }
          },
          {
            "name": "rd_min",
            "in": "query",
            "description": "Minimum referring domains count",
            "schema": {
              "type": "integer",
              "minimum": 0
            }
          },
          {
            "name": "tf_min",
            "in": "query",
            "description": "Minimum Trust Flow (0-100)",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 100
            }
          },
          {
            "name": "cf_min",
            "in": "query",
            "description": "Minimum Citation Flow (0-100)",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 100
            }
          },
          {
            "name": "categories",
            "in": "query",
            "description": "Comma-separated categories: TTF topics or seo.domains categories, parent (health) or parent/child (recreation/travel). Case-insensitive.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "techs",
            "in": "query",
            "description": "Comma-separated historical tech stack labels (case-sensitive). OR semantic: a domain matches if its historical_tech contains ANY of the labels. Examples: 'WordPress', 'Google Maps', 'Stripe,Shopify'. Pro plans cannot get regfee results through this filter — the access-regfree gate is enforced before the filter applies.",
            "schema": {
              "type": "string",
              "maxLength": 500
            },
            "example": "WordPress,Yoast SEO"
          },
          {
            "name": "language",
            "in": "query",
            "description": "Filter by detected language code (EN, FR, DE, ES, etc.)",
            "schema": {
              "type": "string",
              "maxLength": 5
            }
          },
          {
            "name": "contains",
            "in": "query",
            "description": "Keyword the domain name must contain. Single term or comma-separated list with OR semantic (e.g. 'entreprise,entrepreneur' matches names containing either).",
            "schema": {
              "type": "string",
              "maxLength": 200
            },
            "example": "entreprise,entrepreneur"
          },
          {
            "name": "price_min",
            "in": "query",
            "description": "Minimum price or bid in each source's native currency",
            "schema": {
              "type": "number",
              "minimum": 0
            }
          },
          {
            "name": "price_max",
            "in": "query",
            "description": "Maximum price or bid in each source's native currency",
            "schema": {
              "type": "number",
              "minimum": 0
            }
          },
          {
            "name": "snapshots_min",
            "in": "query",
            "description": "Minimum Wayback Machine snapshots",
            "schema": {
              "type": "integer",
              "minimum": 0
            }
          },
          {
            "name": "use_cases",
            "in": "query",
            "description": "Comma-separated buyer-intent categories derived from historical tech. OR semantic: a domain matches if it has ANY requested category. Available values: ecommerce, local-biz, news, saas, forum, media, developer.",
            "schema": {
              "type": "string",
              "maxLength": 200
            },
            "example": "ecommerce,saas"
          },
          {
            "name": "traffic_min",
            "in": "query",
            "description": "Minimum latest estimated worldwide monthly organic traffic",
            "schema": {
              "type": "integer",
              "minimum": 0
            }
          },
          {
            "name": "created_after",
            "in": "query",
            "description": "Only domains added on or after this date",
            "schema": {
              "type": "string",
              "format": "date"
            },
            "example": "2026-09-01"
          },
          {
            "name": "created_before",
            "in": "query",
            "description": "Only domains added before this date",
            "schema": {
              "type": "string",
              "format": "date"
            },
            "example": "2026-09-02"
          },
          {
            "name": "ends_after",
            "in": "query",
            "description": "Only auctions ending on or after this date",
            "schema": {
              "type": "string",
              "format": "date"
            },
            "example": "2026-09-11"
          },
          {
            "name": "ends_before",
            "in": "query",
            "description": "Only auctions ending before this date",
            "schema": {
              "type": "string",
              "format": "date"
            },
            "example": "2026-09-12"
          },
          {
            "name": "include_historical_traffic",
            "in": "query",
            "description": "Include the full historical_traffic object. Disabled by default because the payload is comparatively large.",
            "schema": {
              "type": "boolean",
              "default": false
            }
          },
          {
            "name": "per_page",
            "in": "query",
            "description": "Results per page (1-100, default 50)",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 50
            }
          },
          {
            "name": "page",
            "in": "query",
            "description": "Page number",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "default": 1
            }
          },
          {
            "name": "after_id",
            "in": "query",
            "description": "Keyset cursor for bulk access: returns rows with id > after_id ordered by id asc — cheap at any depth, preferred over deep page offsets for full syncs. The response gains a top-level `cursor` object (next_after_id, has_more); pass next_after_id back as after_id to continue. page/per_page offsets and standard links/meta are non-authoritative in cursor mode. Cursor results ALWAYS exclude source=regfree rows; requesting source=regfree with after_id, or using the cursor from a trial account or free API channel, returns 403 cursor_not_available. For incremental syncs prefer created_after.",
            "schema": {
              "type": "integer",
              "minimum": 0
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Paginated list of domains",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/Domain"
                      }
                    },
                    "links": {
                      "$ref": "#/components/schemas/PaginationLinks"
                    },
                    "meta": {
                      "$ref": "#/components/schemas/PaginationMeta"
                    },
                    "cursor": {
                      "type": "object",
                      "description": "Present only when the request used after_id (keyset mode). links/meta are non-authoritative in cursor mode.",
                      "properties": {
                        "after_id": {
                          "type": "integer"
                        },
                        "next_after_id": {
                          "type": "integer",
                          "nullable": true
                        },
                        "has_more": {
                          "type": "boolean"
                        },
                        "order": {
                          "type": "string",
                          "example": "id asc"
                        },
                        "note": {
                          "type": "string"
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid API token"
          },
          "403": {
            "description": "Valid token but no Pro subscription — or, for after_id requests, cursor_not_available: the keyset cursor is denied for free API channels, trial accounts and source=regfree (JSON body: error, message, docs)"
          }
        }
      }
    },
    "/domains/{domain}": {
      "get": {
        "operationId": "getDomain",
        "summary": "Get a single domain by ID",
        "description": "Returns full details for a specific domain.",
        "tags": [
          "Domains"
        ],
        "parameters": [
          {
            "name": "domain",
            "in": "path",
            "required": true,
            "description": "Domain ID",
            "schema": {
              "type": "integer"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Domain details",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "$ref": "#/components/schemas/Domain"
                    }
                  }
                }
              }
            }
          },
          "404": {
            "description": "Domain not found"
          }
        }
      }
    },
    "/pending-delete": {
      "get": {
        "tags": [
          "Pending-Delete"
        ],
        "operationId": "listPendingDeleteDomains",
        "summary": "List pending-delete domains (Authority+)",
        "description": "Weekly inventory of domains about to drop across 125+ ccTLDs and gTLDs. Default view (week_end=all) returns upcoming drops only, soonest first; rows whose estimated drop date already passed are excluded unless include_past=1. Requires an Authority+ subscription (403 with upgrade_url otherwise).",
        "parameters": [
          {
            "name": "tld",
            "in": "query",
            "description": "Comma-separated TLD list, with or without leading dot",
            "schema": {
              "type": "string",
              "example": "fr,de,com"
            }
          },
          {
            "name": "status",
            "in": "query",
            "description": "Comma-separated WHOIS status filter",
            "schema": {
              "type": "string",
              "example": "pendingDelete,redemptionPeriod"
            }
          },
          {
            "name": "source",
            "in": "query",
            "description": "Pipeline source",
            "schema": {
              "type": "string",
              "enum": [
                "oi-diff",
                "czds-daily"
              ]
            }
          },
          {
            "name": "week_end",
            "in": "query",
            "description": "Snapshot week (YYYY-MM-DD) or 'all' (combined view). Explicit weeks include historical rows regardless of drop date.",
            "schema": {
              "type": "string",
              "default": "all"
            }
          },
          {
            "name": "drops_within",
            "in": "query",
            "description": "Only rows whose estimated drop date is within N days from today (never past dates)",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 60
            }
          },
          {
            "name": "contains",
            "in": "query",
            "description": "Substring match on the domain name",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "no_dashes",
            "in": "query",
            "description": "Exclude SLDs containing hyphens",
            "schema": {
              "type": "boolean"
            }
          },
          {
            "name": "no_numbers",
            "in": "query",
            "description": "Exclude SLDs containing digits",
            "schema": {
              "type": "boolean"
            }
          },
          {
            "name": "include_past",
            "in": "query",
            "description": "With week_end=all, also return rows whose estimated drop date already passed",
            "schema": {
              "type": "boolean",
              "default": false
            }
          },
          {
            "name": "sort",
            "in": "query",
            "description": "Ordering. drop_date = soonest first, rows without a computable date last. drop_date_desc lists rows without a date first; combine with drops_within to keep dated rows only.",
            "schema": {
              "type": "string",
              "enum": [
                "drop_date",
                "drop_date_desc",
                "domain"
              ],
              "default": "drop_date"
            }
          },
          {
            "name": "per_page",
            "in": "query",
            "description": "Results per page (this endpoint uses per_page, not limit)",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 200,
              "default": 50
            }
          },
          {
            "name": "page",
            "in": "query",
            "description": "Page number",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "default": 1
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Paginated list of pending-delete domains",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/PendingDeleteDomain"
                      }
                    },
                    "links": {
                      "$ref": "#/components/schemas/PaginationLinks"
                    },
                    "meta": {
                      "$ref": "#/components/schemas/PaginationMeta"
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid API token"
          },
          "403": {
            "description": "Valid token but no Authority+ subscription (response includes upgrade_url)"
          },
          "503": {
            "description": "The request could not be served within its server-side budget. Every SQL statement on this route runs under an execution budget (count 6 s, ordered walk 4 s, row fetch 2 s) and a cold total for a given filter shape is computed by one request at a time; concurrent or over-budget requests get this JSON response with a Retry-After header instead of a proxy 504. Retry after the indicated delay, or narrow the query (tld, status, drops_within).",
            "headers": {
              "Retry-After": {
                "description": "Seconds to wait before retrying.",
                "schema": {
                  "type": "integer"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "type": "string",
                      "enum": [
                        "count_busy",
                        "count_timeout",
                        "rows_timeout"
                      ]
                    },
                    "message": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "error",
                    "message"
                  ]
                }
              }
            }
          }
        }
      }
    },
    "/pending-delete/{domain}": {
      "get": {
        "tags": [
          "Pending-Delete"
        ],
        "operationId": "getPendingDeleteDomain",
        "summary": "Look up one pending-delete domain (Authority+)",
        "description": "Case-insensitive lookup by domain name. Returns the most recent snapshot row, or 404 if the domain is not currently in actionable pending-delete state.",
        "parameters": [
          {
            "name": "domain",
            "in": "path",
            "required": true,
            "description": "Full domain name",
            "schema": {
              "type": "string",
              "example": "example.fr"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "The pending-delete row",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "$ref": "#/components/schemas/PendingDeleteDomain"
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid API token"
          },
          "403": {
            "description": "Valid token but no Authority+ subscription"
          },
          "404": {
            "description": "Domain not in actionable pending-delete state"
          }
        }
      }
    }
  },
